[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recon-qa"
version = "0.1.0"
description = "Recon: AI QA Agent — Autonomous Testing & Failure Analysis Platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Recon Engineering Team" }]
keywords = ["qa", "testing", "automation", "playwright", "ai", "failure-analysis", "openapi"]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "jinja2>=3.1.4",
    "jsonschema>=4.22.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "beautifulsoup4>=4.12.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.44.0",
]
ai = [
    "google-genai>=1.0.0",
    "openai>=1.30.0",
]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
recon = "recon.apps.cli.main:app"
qa-agent = "recon.apps.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["recon*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
