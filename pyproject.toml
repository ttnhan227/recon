[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recon-qa"
version = "0.2.1"
description = "OpenAPI and browser test generation with optional LLM-assisted failure analysis"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Recon Engineering Team" }]
keywords = ["qa", "testing", "automation", "playwright", "ai", "failure-analysis", "openapi", "dag-chaining"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "jinja2>=3.1.4",
    "jsonschema>=4.22.0",
    "beautifulsoup4>=4.12.0",
    "pyyaml>=6.0.1",
]

[project.urls]
Homepage = "https://github.com/ttnhan227/recon"
Repository = "https://github.com/ttnhan227/recon"
Issues = "https://github.com/ttnhan227/recon/issues"
Changelog = "https://github.com/ttnhan227/recon/blob/main/CHANGELOG.md"

[project.optional-dependencies]
browser = [
    "playwright>=1.44.0",
]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "build>=1.2.0",
    "twine>=5.0.0",
    "pillow>=11.0.0",
    "types-PyYAML>=6.0.12.20240314",
    "types-jsonschema>=4.22.0.20240428",
]

[project.scripts]
recon = "recon.apps.cli.main:app"
qa-agent = "recon.apps.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["recon*"]

[tool.setuptools.package-data]
"recon.demo_app" = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = false
