name: Feature request
description: Propose a user problem for Recon QA to solve
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the workflow and obstacle before suggesting an implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would a useful outcome look like?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried already?
