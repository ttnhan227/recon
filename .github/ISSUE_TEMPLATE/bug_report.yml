name: Bug report
description: Report reproducible incorrect behavior in Recon QA
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to provide a reproducible report. Remove secrets and private target data before submitting.
  - type: input
    id: version
    attributes:
      label: Recon QA version
      placeholder: "0.2.1"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python and operating system
      placeholder: "Python 3.12.7 on Windows 11"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Sanitized command or minimal reproduction
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized output
    validations:
      required: true
  - type: checkboxes
    id: authorization
    attributes:
      label: Target authorization
      options:
        - label: I own or am authorized to test the target used in this report.
          required: true
